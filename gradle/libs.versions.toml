[versions]
kotlin = "2.4.21"
kotlinx-coroutines = "1.11.0"

shadow = "9.6.1"
minotaur = "2.10.0"
blossom = "2.2.0"

simplecloud-api = "0.1.0-platform.58-dev.5.1-fe01ce5"
simplecloud-plugin = "1.0.0"

velocity = "4.1.0-SNAPSHOT"
bungeecord-api = "1.21-R0.4"

adventure-api = "5.2.0"

configurate = "4.2.0"

cloud-core = "2.1.0"
cloud-platform = "2.0.1"

slf4j = "2.0.20"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }

simplecloud-api = { module = "app.simplecloud.api:api", version.ref = "simplecloud-api" }
simplecloud-plugin = { module = "app.simplecloud.plugin:plugin-shared", version.ref = "simplecloud-plugin" }
simplecloud-plugin-velocity = { module = "app.simplecloud.plugin:plugin-velocity", version.ref = "simplecloud-plugin" }
simplecloud-plugin-bungeecord = { module = "app.simplecloud.plugin:plugin-bungeecord", version.ref = "simplecloud-plugin" }

velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity" }
bungeecord-api = { module = "net.md-5:bungeecord-api", version.ref = "bungeecord-api" }

adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure-api" }
adventure-text-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure-api" }

configurate-yaml = { module = "org.spongepowered:configurate-yaml", version.ref = "configurate" }
configurate-kotlin = { module = "org.spongepowered:configurate-extra-kotlin", version.ref = "configurate" }

cloud-core = { module = "org.incendo:cloud-core", version.ref = "cloud-core" }
cloud-coroutines = { module = "org.incendo:cloud-kotlin-coroutines", version.ref = "cloud-core" }
cloud-velocity = { module = "org.incendo:cloud-velocity", version.ref = "cloud-platform" }
cloud-bungeecord = { module = "org.incendo:cloud-bungee", version.ref = "cloud-platform" }

slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }

[bundles]
configurate = ["configurate-kotlin", "configurate-yaml"]
cloud = ["cloud-core", "cloud-coroutines"]

[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
minotaur = { id = "com.modrinth.minotaur", version.ref = "minotaur" }
blossom = { id = "net.kyori.blossom", version.ref = "blossom" }